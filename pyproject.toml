# Project metadata and tool configuration. The app runs from a source checkout
# (`python -m intonation` or `python main.py`) or from the PyInstaller release
# binaries; it is not packaged as an installable wheel, so there is no
# [build-system] table.

[project]
name = "saxophone-intonation-table"
version = "1.4.0"
description = "Real-time saxophone intonation analyzer with cents-deviation table and chart export."
readme = "README.md"
requires-python = ">=3.10"
# Licensing is mixed (GPL-3.0-or-later for this fork, unlicensed upstream
# code); NOTICE.md explains it, so no single SPDX expression is declared.
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "knelsonb" }]
dependencies = [
    "PyQt6~=6.7",
    "numpy~=2.0",
    "sounddevice~=0.5",
    "reportlab~=4.2",
]

[project.optional-dependencies]
# The drone and pitch-pipe SoundFont synth. Install with --no-deps; see the note
# in requirements.txt.
drone = ["tinysoundfont~=0.3.7"]
dev = [
    "pytest~=9.0",
    "pyinstaller~=6.0",
    "Pillow~=10.0",
]

# The app is the `intonation` package. The repo root also holds the launcher,
# test helpers and the pre-2.0 sax_* shims, so automatic discovery would find
# several top-level modules; name the package for any tool that reads this
# (setuptools is also pip's fallback backend for `pip install .`).
[tool.setuptools.packages.find]
include = ["intonation*"]

[tool.pytest.ini_options]
# The root unit tests, tests/acceptance, tests/contracts and tests/golden.
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The UI string tables hold long German and English sentences on single lines;
# wrapping them would split each message across several literals.
"intonation/i18n/strings.py" = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["intonation"]
