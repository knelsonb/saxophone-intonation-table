name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default. Only the publish job below gets a write token, so the
# build steps that install packages from PyPI never hold one.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag kept as a comment) so a moved
# upstream tag cannot change what runs here.

jobs:
  test:
    name: Tests + version gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system audio + Qt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2 \
            libegl1 libgl1 libxcb-cursor0 libxcb-util1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install --no-deps "tinysoundfont~=0.3.7"
          pip install "pytest~=9.0"

      - name: Tag matches APP_VERSION and pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python -c "import ast,sys; t=ast.parse(open('sax_intonation_gui.py',encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and getattr(n.targets[0],'id','')=='APP_VERSION'))")
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag APP_VERSION=$app pyproject=$proj"
          [ "$tag" = "$app" ] && [ "$tag" = "$proj" ] || { echo "::error::tag, APP_VERSION and pyproject version disagree"; exit 1; }

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixed runner images: ubuntu-22.04 keeps the Linux binary's glibc
          # baseline low, macos-14 is the arm64 image the artifact name promises.
          - os: ubuntu-22.04
            artifact_name: intonation-analyzer-linux-x86_64.tar.gz
            binary_name: intonation-analyzer
          - os: windows-2022
            artifact_name: intonation-analyzer-windows-x86_64.exe
            binary_name: intonation-analyzer.exe
          - os: macos-14
            artifact_name: intonation-analyzer-macos-arm64.tar.gz
            binary_name: intonation-analyzer

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2 \
            libegl1 libgl1 libxcb-cursor0 libxcb-util1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          # tinysoundfont (drone synth): install WITHOUT deps — its only hard
          # dep is pyaudio (needs PortAudio headers, unused; we synth into our
          # own mixer). See the note in requirements.txt.
          pip install --no-deps "tinysoundfont~=0.3.7"
          # Pillow >=9.1: earlier versions ignored the `sizes` kwarg on ICO
          # export. PyInstaller 6.x: collect_dynamic_libs behavior is stable on
          # this line; a 7.x bump could silently regress portaudio bundling.
          pip install "pyinstaller~=6.0" "Pillow~=10.0"

      - name: Generate icon assets
        # QT_QPA_PLATFORM=offscreen is load-bearing on the Linux runner — it
        # has no X display, and QApplication() would crash without a platform.
        run: python tools/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build binary
        run: pyinstaller --clean -y intonation_analyzer.spec

      - name: Package artifact
        # Linux/macOS binaries are tarred because artifact upload drops the
        # executable bit; the tarball carries the licence notices alongside.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}"
          else
            chmod +x "dist/${{ matrix.binary_name }}"
            cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md dist/
            tar -C dist -czf "dist/${{ matrix.artifact_name }}" \
              "${{ matrix.binary_name }}" LICENSE NOTICE.md THIRD_PARTY_NOTICES.md
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Flatten artifacts and checksum
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
